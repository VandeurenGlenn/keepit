# Install as /etc/nginx/conf.d/keepit.conf.
# Keepit serves both the frontend and API from the same Node process.

map $http_upgrade $keepit_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream keepit_backend {
    server 127.0.0.1:5678;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name keepit.dimac.be;

    # Keep this location when Let's Encrypt uses the webroot challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name keepit.dimac.be;

    ssl_certificate /etc/letsencrypt/live/keepit.dimac.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keepit.dimac.be/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:KeepitTLS:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 30m;

    # Websocket endpoint used for realtime planning notifications.
    location = /ws {
        proxy_pass http://keepit_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $keepit_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Frontend, authenticated API, media and Google sign-in callbacks.
    location / {
        proxy_pass http://keepit_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
